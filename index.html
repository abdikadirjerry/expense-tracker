<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <h1>Expense Tracker</h1>

      <section class="balance-container">
        <h2>Your Balance</h2>
        <output id="balance" aria-live="polite">$0.00</output>
      </section>

      <section class="inc-exp-container">
        <div>
          <h3>Income</h3>
          <output id="money-plus" class="money plus" aria-live="polite"
            >+$0.00</output
          >
        </div>
        <div>
          <h3>Expense</h3>
          <output id="money-minus" class="money minus" aria-live="polite"
            >-$0.00</output
          >
        </div>
      </section>

      <section>
        <h3>History</h3>
        <ul id="list" class="list" aria-label="Transaction History"></ul>
      </section>

      <section>
        <h3>Add New Transaction</h3>
        <form id="form">
          <div class="form-control">
            <label for="text">Description</label>
            <input
              type="text"
              id="text"
              placeholder="Enter description..."
              autocomplete="off"
            />
          </div>
          <div class="form-control">
            <label for="amount">
              Amount <br />
              <small>(negative - expense, positive - income)</small>
            </label>
            <input
              type="number"
              id="amount"
              placeholder="Enter amount..."
              step="any"
            />
          </div>
          <button type="submit" class="btn">Add Transaction</button>
        </form>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
